[platformio]
default_envs = goouuu_esp32_s3_cam_v1_5
core_dir = .platformio

[env:goouuu_esp32_s3_cam_v1_5]
platform = espressif32@7.0.1
board = goouuu_esp32_s3_cam_v1_5
framework = arduino
build_type = release
monitor_speed = 921600
upload_speed = 921600
; The host tests build the shared laser_core sources as C++17; build the
; firmware with the same language standard instead of the framework's gnu++11.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; Project sources must stay warning-free. The framework adds -Wno-sign-compare,
; -Wno-unused-parameter and several -Wno-error=... flags ahead of these, so they
; are re-enabled explicitly. -Wconversion is deliberately left out: the
; Arduino/IDF headers included from src/ are not clean under it.
; build_src_flags reaches src/ only; lib/laser_core is built with the framework
; flags (its header is compiled under these flags via
; src/laser_contract_compile_check.cpp).
build_src_flags =
    -Wall
    -Wextra
    -Wsign-compare
    -Wunused-parameter
    -Werror
    -Werror=unused-function
    -Werror=unused-variable
    -Werror=unused-but-set-variable
    -Werror=deprecated-declarations
