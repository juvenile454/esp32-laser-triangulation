name: Bug report
description: Something in the firmware, host tools or docs does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please report security problems and unsafe laser behaviour **privately**
        via the Security tab instead of here. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands, serial commands or viewer actions.
      render: shell
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or release
      placeholder: e.g. v0.1.0 or a commit SHA
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Firmware (ESP32-S3)
        - C++ extraction core
        - Python host tools
        - Live viewer
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Hardware and environment
      description: Board, camera, host OS, Python version, PlatformIO version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or serial output
      render: text
