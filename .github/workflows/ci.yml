name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install host dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: C++ tests, sanitizers, C++11 check, lint, types and Python tests
        run: make check PYTHON=python

  firmware:
    name: Firmware cross-build (ESP32-S3)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-firmware.txt

      - name: Cache PlatformIO toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/*.json', 'requirements-firmware.txt') }}

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check -r requirements-firmware.txt

      - name: Cross-build firmware (warnings are errors in src/)
        run: make firmware PIO=pio
