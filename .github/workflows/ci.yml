name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install host dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt ruff==0.16.9

      - name: Lint Python
        run: ruff check tools tests

      - name: Build and test portable C++ core
        run: make clean test sanitize

      - name: Test Python tools, viewer controls and C++ parity
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q tools tests

      - name: Cross-build ESP32-S3 firmware
        run: pio run -j 1
